<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DINKFLIX Web 2.1 Preview</title><link rel="stylesheet" href="../dinkflix.css"></head>
<body class="df-custom-route">
<nav id="dinkflix-nav"><div class="df-nav-inner"><a class="df-brand"><span class="df-brand-dot"></span><span>DINKFLIX</span></a><div class="df-nav-links"><a class="df-nav-link df-active"><span>⌂</span><span class="df-nav-label">Home</span></a><a class="df-nav-link"><span>▣</span><span class="df-nav-label">Movies</span></a><a class="df-nav-link"><span>▤</span><span class="df-nav-label">TV Shows</span></a><a class="df-nav-link"><span>＋</span><span class="df-nav-label">My List</span></a></div><div class="df-nav-spacer"></div><button class="df-search-button">⌕</button><button class="df-user-button"><span class="df-avatar">C</span></button></div></nav>
<main id="dinkflix-app-shell"><div class="df-page">
<section class="df-hero"><div class="df-hero-art df-ready" style="opacity:1;background:radial-gradient(circle at 75% 25%,rgba(0,255,198,.34),transparent 28%),radial-gradient(circle at 62% 68%,rgba(148,92,255,.30),transparent 30%),linear-gradient(115deg,#131a21,#06080d 55%,#111b20)"></div><div class="df-hero-inner"><div class="df-hero-copy"><div class="df-hero-kicker">Recently Added</div><h1 class="df-hero-title">The Last Horizon</h1><div class="df-hero-meta"><span class="df-badge df-badge-rating">★ 8.3</span><span>2026</span><span class="df-meta-dot">•</span><span>2h 14m</span><span class="df-meta-dot">•</span><span>Sci-Fi · Thriller</span></div><p class="df-hero-overview">Humanity's final expedition discovers something beneath an abandoned frontier station that was never meant to be found.</p><div class="df-actions"><button class="df-button df-button-primary">▶ Play</button><button class="df-button df-button-secondary">More info</button><button class="df-button df-button-secondary">＋ My List</button></div></div></div></section>
<section class="df-section"><div class="df-section-head"><h2 class="df-section-title">Continue Watching</h2><a class="df-link-button">View all →</a></div><div class="df-row df-row-wide" id="wide"></div></section>
<section class="df-section"><div class="df-section-head"><h2 class="df-section-title">Recently Added</h2><a class="df-link-button">View all →</a></div><div class="df-row" id="posters"></div></section>
</div></main>
<script>
const svg=(a,b,c)=>`data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="100%" height="100%" fill="${a}"/><circle cx="830" cy="190" r="220" fill="${b}" opacity=".75"/><circle cx="260" cy="520" r="260" fill="${c}" opacity=".48"/></svg>`)}`;
const posters=[['Signal Lost','#122128','#00ffc6','#8a63ff','★ 7.9','2026'],['Midnight Run','#201610','#ffb84a','#ff6b7c','★ 8.1','2025'],['Northern Lights','#11182c','#78b7ff','#a98bff','★ 8.5','2026'],['District Nine','#26131d','#ff6e95','#00ffc6','★ 7.6','2024'],['After the Fall','#14191c','#ffc95c','#69e9ae','★ 8.0','2026'],['The Deep','#101522','#7c8cff','#00ffc6','★ 8.4','2023']];
function make(title,img,rating,year,wide=false){return `<article class="df-card ${wide?'df-card-wide':''}"><div class="df-card-poster"><img class="df-card-image" src="${img}" alt=""><div class="df-card-gradient"></div><div class="df-card-badges"><span class="df-badge df-badge-rating">${rating}</span><span class="df-badge df-badge-quality">4K</span><span class="df-badge df-badge-hdr">HDR</span></div></div><div class="df-card-body"><h3 class="df-card-title">${title}</h3><div class="df-card-meta">${year}<span class="df-meta-dot">•</span>2h 03m</div></div>${wide?'<div class="df-card-progress"><span style="width:62%"></span></div>':''}</article>`}
document.getElementById('posters').innerHTML=posters.map(([t,a,b,c,r,y])=>make(t,svg(a,b,c),r,y)).join('');
document.getElementById('wide').innerHTML=posters.slice(0,4).map(([t,a,b,c,r,y])=>make(t,svg(a,b,c),r,y,true)).join('');
</script></body></html>
