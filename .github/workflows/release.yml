name: Build and Release DINKFLIX Web

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.100"

      - name: Restore
        run: dotnet restore src/Jellyfin.Plugin.DinkFlix/Jellyfin.Plugin.DinkFlix.csproj

      - name: Publish
        shell: bash
        run: |
          plugin_version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Jellyfin.Plugin.DinkFlix/Jellyfin.Plugin.DinkFlix.csproj \
            -c Release \
            -o artifacts/publish \
            --no-restore \
            -p:Version="${plugin_version}"

      - name: Package plugin
        id: package
        shell: bash
        run: |
          plugin_version="${GITHUB_REF_NAME#v}"
          zip_name="DinkFlix.Web_${plugin_version}.zip"
          rm -f "${zip_name}"
          (cd artifacts/publish && zip -9 -j "../../${zip_name}" Jellyfin.Plugin.DinkFlix.dll)
          checksum="$(md5sum "${zip_name}" | awk '{print toupper($1)}')"
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksum}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          title="DINKFLIX Web ${tag#v}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${{ steps.package.outputs.zip_name }}" --clobber
            gh release edit "${tag}" --title "${title}" --notes "DINKFLIX Web desktop-first Jellyfin experience."
          else
            gh release create "${tag}" "${{ steps.package.outputs.zip_name }}" --title "${title}" --generate-notes
          fi

      - name: Update plugin manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          path = 'manifest.json'
          with open(path, encoding='utf-8') as handle:
              data = json.load(handle)
          version = os.environ['TAG'].lstrip('v')
          entry = {
              'version': version,
              'changelog': f'DINKFLIX Web {version}: desktop-first Jellyfin 12.x experience with custom navigation, discovery, library grids, My List and detail pages.',
              'targetAbi': '12.0.0.0',
              'sourceUrl': f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{os.environ['TAG']}/DinkFlix.Web_{version}.zip",
              'checksum': os.environ['CHECKSUM'],
              'timestamp': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          }
          for plugin in data:
              if plugin.get('guid') == '9b8e4d39-6a4c-4b5d-b6aa-d2b1c4f3c9e8':
                  existing = plugin.get('versions', [])
                  plugin['versions'] = [entry] + [item for item in existing if item.get('version') != version]
                  break
          else:
              raise SystemExit('DINKFLIX manifest entry not found')
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(data, handle, indent=2)
              handle.write('\n')
          PY

      - name: Commit manifest back to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${branch}"
          git checkout "${branch}"
          git pull --ff-only origin "${branch}"
          git add manifest.json
          git commit -m "chore: publish DINKFLIX Web ${GITHUB_REF_NAME}" || echo "manifest already current"
          git push origin "${branch}"
