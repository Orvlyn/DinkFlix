name: DINKFLIX Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  JELLYFIN_VERSION: "12.0.0"
  TARGET_ABI: "12.0.0.0"
  CSPROJ: "src/Jellyfin.Plugin.SleekFin/Jellyfin.Plugin.SleekFin.csproj"
  ASSEMBLY_INFO: "src/Jellyfin.Plugin.SleekFin/Properties/AssemblyInfo.cs"

jobs:
  release:
    if: contains(github.event.head_commit.message, '(v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          MSG=$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH" | head -n1)
          if [[ "$MSG" =~ \(v([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "No release version found"
            exit 1
          fi

      - name: Update version metadata
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/<Version>[0-9.]*<\/Version>/<Version>${VERSION}<\/Version>/" "${{ env.CSPROJ }}"
          if [ -f "${{ env.ASSEMBLY_INFO }}" ]; then
            sed -i "s/\[assembly: AssemblyVersion(\"[0-9.]*\")\]/[assembly: AssemblyVersion(\"${VERSION}\")]/" "${{ env.ASSEMBLY_INFO }}"
            sed -i "s/\[assembly: AssemblyFileVersion(\"[0-9.]*\")\]/[assembly: AssemblyFileVersion(\"${VERSION}\")]/" "${{ env.ASSEMBLY_INFO }}"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Build plugin
        run: dotnet build "$CSPROJ" --configuration Release -p:JellyfinVersion="$JELLYFIN_VERSION"

      - name: Package DINKFLIX plugin
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT_DIR="${GITHUB_WORKSPACE}/src/Jellyfin.Plugin.SleekFin/bin/Release/net10.0"
          DIST_DIR="${GITHUB_WORKSPACE}/dist"
          ZIP_NAME="Jellyfin.Plugin.DINKFLIX_12.0.zip"
          mkdir -p "$DIST_DIR"
          cp meta.json "$OUT_DIR/meta.json"
          jq --arg version "$VERSION" \
             --arg targetAbi "$TARGET_ABI" \
             '.version=$version | .targetAbi=$targetAbi | .name="DINKFLIX" | .owner="Orvlyn" | .description="A custom premium Jellyfin experience based on SleekFin and maintained by Orvlyn." | .overview="DINKFLIX: a dark, modern Jellyfin interface with a mint accent." | .assemblies=["Jellyfin.Plugin.SleekFin.dll"]' \
             meta.json > "$OUT_DIR/meta.json"
          (cd "$OUT_DIR" && zip -j "$DIST_DIR/$ZIP_NAME" Jellyfin.Plugin.SleekFin.dll meta.json thumb.png)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "$DIST_DIR/$ZIP_NAME" | awk '{print toupper($1)}')" >> "$GITHUB_OUTPUT"

      - name: Update manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg version "$VERSION" \
             --arg sourceUrl "https://github.com/Orvlyn/DinkFlix/releases/download/$VERSION/Jellyfin.Plugin.DINKFLIX_12.0.zip" \
             --arg checksum "${{ steps.package.outputs.checksum }}" \
             --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)" \
             '. as $root | $root[0].versions = ([{version:$version,changelog:"DINKFLIX release",targetAbi:"12.0.0.0",sourceUrl:$sourceUrl,checksum:$checksum,timestamp:$timestamp,dependencies:[]}] + ($root[0].versions // [] | map(select(.version != $version))))' \
             manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json meta.json "$CSPROJ"
          git diff --staged --quiet || git commit -m "chore: update DINKFLIX release metadata"
          git push origin HEAD:main

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: DINKFLIX ${{ steps.version.outputs.version }}
          body: "DINKFLIX release based on the SleekFin foundation, rebranded and maintained by Orvlyn."
          files: dist/${{ steps.package.outputs.zip_name }}
          fail_on_unmatched_files: true
