name: Publish DINKFLIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('build.yaml').read_text()
          m = re.search(r'^version:\s*["\']?([^"\'\s]+)', text, re.M)
          if not m:
              raise SystemExit('version missing')
          print(m.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Static checks
        run: |
          python3 tools/check.py
          node --check src/Jellyfin.Plugin.DinkFlix/Web/dinkflix.js

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Jellyfin.Plugin.DinkFlix/Jellyfin.Plugin.DinkFlix.csproj

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.DinkFlix/Jellyfin.Plugin.DinkFlix.csproj -c Release --no-restore

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/package
          cp src/Jellyfin.Plugin.DinkFlix/bin/Release/net10.0/Jellyfin.Plugin.DinkFlix.dll dist/package/
          cd dist/package
          zip -q -9 "../../DinkFlix_${{ steps.version.outputs.version }}.zip" ./*
          cd ../..
          md5sum "DinkFlix_${{ steps.version.outputs.version }}.zip" | cut -d' ' -f1 > dist/checksum.md5

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: DINKFLIX-${{ steps.version.outputs.version }}
          path: DinkFlix_${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Build manifest entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: v${{ steps.version.outputs.version }}
        shell: python
        run: |
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          package = Path(f"DinkFlix_{os.environ['VERSION']}.zip")
          md5 = hashlib.md5(package.read_bytes()).hexdigest()
          manifest = json.loads(Path('manifest.json').read_text())
          if not isinstance(manifest, list):
              manifest = [manifest]
          plugin = next((p for p in manifest if p.get('guid') == 'B4A9D4E6-4E4D-4F42-9E90-9C5B4D4B8D2B'), None)
          if plugin is None:
              plugin = {
                'guid': 'B4A9D4E6-4E4D-4F42-9E90-9C5B4D4B8D2B',
                'name': 'DINKFLIX',
                'overview': 'Native Jellyfin 12 theme with lightweight DINKFLIX enhancements.',
                'description': 'A standalone DINKFLIX visual theme that styles Jellyfin native UI. Optional plugin enhancements add only features CSS cannot provide.',
                'owner': 'Orvlyn',
                'category': 'General',
                'versions': []
              }
              manifest.append(plugin)
          entry = {
            'version': os.environ['VERSION'],
            'changelog': f'DINKFLIX {os.environ["VERSION"]}: Jellyfin-native theme and lightweight enhancements.',
            'targetAbi': '12.0.0.0',
            'sourceUrl': f'https://github.com/Orvlyn/DinkFlix/releases/download/{os.environ["TAG"]}/{package.name}',
            'checksum': md5,
            'timestamp': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'framework': 'net10.0'
          }
          plugin['versions'] = [entry] + [v for v in plugin.get('versions', []) if v.get('version') != entry['version']]
          Path('dist/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          files: |
            DinkFlix_${{ steps.version.outputs.version }}.zip
            dist/manifest.json
            dist/checksum.md5
          generate_release_notes: true

      - name: Publish manifest
        shell: bash
        run: |
          cp dist/manifest.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "chore: publish DINKFLIX ${{ steps.version.outputs.version }} manifest"
          git push origin HEAD:main
