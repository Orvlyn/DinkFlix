<div data-role="page" class="page type-interior pluginConfigurationPage">
  <div class="content-primary">
    <div class="sectionTitleContainer flex align-items-center">
      <h2 class="sectionTitle">DINKFLIX</h2>
    </div>
    <form id="DinkFlixConfigForm">
      <div class="paperList">
        <label class="checkboxContainer">
          <input type="checkbox" is="emby-checkbox" id="EnableEnhancements">
          <span>Enable DINKFLIX enhancements</span>
        </label>
        <label class="checkboxContainer">
          <input type="checkbox" is="emby-checkbox" id="GroupContinueWatching">
          <span>Group Continue Watching by TV series</span>
        </label>
        <label class="checkboxContainer">
          <input type="checkbox" is="emby-checkbox" id="ShowLocalEndTime">
          <span>Show local estimated end time on details pages</span>
        </label>
        <label class="checkboxContainer">
          <input type="checkbox" is="emby-checkbox" id="ShowMediaTechnicalDetails">
          <span>Show video, audio and subtitle details</span>
        </label>
      </div>
      <div class="fieldDescription">DINKFLIX itself is the theme loaded from GitHub Custom CSS. These settings only control the lightweight DINKFLIX features that CSS cannot provide. Jellyfin remains responsible for navigation, playback, menus, search, profiles, preferences, Requests and administration.</div>
      <button is="emby-button" type="submit" class="raised button-submit">Save</button>
      <span id="DinkFlixSaveStatus" aria-live="polite"></span>
    </form>
  </div>
</div>
<script>
(function () {
  const form = document.getElementById('DinkFlixConfigForm');
  const status = document.getElementById('DinkFlixSaveStatus');
  const fields = ['EnableEnhancements','GroupContinueWatching','ShowLocalEndTime','ShowMediaTechnicalDetails'];
  async function pluginId() {
    const list = await ApiClient.getPlugins();
    const p = list.find(x => x.Name === 'DINKFLIX');
    if (!p) throw new Error('DINKFLIX plugin not found');
    return p.Id;
  }
  async function load() {
    try {
      const id = await pluginId();
      const cfg = await ApiClient.getPluginConfiguration(id);
      fields.forEach(k => { document.getElementById(k).checked = cfg[k] !== false; });
      status.textContent = '';
    } catch (e) { status.textContent = 'Unable to load settings.'; console.error(e); }
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const id = await pluginId();
      const cfg = await ApiClient.getPluginConfiguration(id);
      fields.forEach(k => { cfg[k] = document.getElementById(k).checked; });
      await ApiClient.updatePluginConfiguration(id, cfg);
      status.textContent = 'Saved.';
    } catch (e) { status.textContent = 'Save failed.'; console.error(e); }
  });
  load();
}());
</script>
